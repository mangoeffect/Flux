name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # Release 包内置的 frpc 版本(升级时改这一处)
  FRPC_VERSION: "0.71.0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle frpc
        shell: bash
        run: |
          bash scripts/fetch_frpc.sh windows amd64 "$FRPC_VERSION"
          cp third_party/frpc/windows-amd64/frpc.exe build/windows/x64/runner/Release/
      # ── 代码签名(可选):配置 secrets WINDOWS_CERT_PFX_B64(pfx 的 Base64)
      #    与 WINDOWS_CERT_PASSWORD 后取消注释,避免 SmartScreen 拦截
      # - name: Sign exe
      #   shell: pwsh
      #   env:
      #     PFX: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
      #     PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      #   run: |
      #     [IO.File]::WriteAllBytes('cert.pfx', [Convert]::FromBase64String($env:PFX))
      #     signtool sign /f cert.pfx /p $env:PW /fd SHA256 `
      #       /tr http://timestamp.digicert.com /td SHA256 `
      #       build/windows/x64/runner/Release/flux.exe
      - name: Pack zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath flux-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: flux-windows-x64
          path: flux-windows-x64.zip

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Bundle frpc + dmg
        run: |
          bash scripts/fetch_frpc.sh darwin arm64 "$FRPC_VERSION"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          cp third_party/frpc/darwin-arm64/frpc "$APP/Contents/MacOS/"
          hdiutil create -volname Flux -srcfolder "$APP" -ov -format UDZO flux-macos-arm64.dmg
      # ── 签名+公证(可选):配置 secrets APPLE_DEV_ID(Developer ID Application
      #    证书名)、APPLE_ID、APPLE_PASSWORD(app-specific)、APPLE_TEAM_ID 后取消注释
      # - name: Codesign + Notarize
      #   env:
      #     DEV_ID: ${{ secrets.APPLE_DEV_ID }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
      #     codesign --force --deep --options runtime --timestamp \
      #       --sign "$DEV_ID" "$APP"
      #     xcrun notarytool store-credentials flux-notary --apple-id "$APPLE_ID" \
      #       --password "$APPLE_PASSWORD" --team-id "$TEAM_ID"
      #     ditto -c -k --keepParent "$APP" flux.zip
      #     xcrun notarytool submit flux.zip --keychain-profile flux-notary --wait
      #     xcrun stapler staple "$APP"
      #     hdiutil create -volname Flux -srcfolder "$APP" -ov -format UDZO flux-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: flux-macos-arm64
          path: flux-macos-arm64.dmg

  # Apple Silicon 之外的 Mac(x64 runner:macos-13 是最后的 Intel 镜像)
  macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Bundle frpc + dmg
        run: |
          bash scripts/fetch_frpc.sh darwin amd64 "$FRPC_VERSION"
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          cp third_party/frpc/darwin-amd64/frpc "$APP/Contents/MacOS/"
          hdiutil create -volname Flux -srcfolder "$APP" -ov -format UDZO flux-macos-x64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: flux-macos-x64
          path: flux-macos-x64.dmg
      # Intel runner 排队时间长,产物成功后自行追加到 Release(softprops 幂等)
      - uses: softprops/action-gh-release@v2
        with:
          files: flux-macos-x64.dmg

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      # tray_manager 需要 ayatana;libsecret 供 token 安全存储
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
          libayatana-appindicator3-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Bundle frpc
        run: |
          bash scripts/fetch_frpc.sh linux amd64 "$FRPC_VERSION"
          cp third_party/frpc/linux-amd64/frpc build/linux/x64/release/bundle/

      # AppImage 打包在 CI 偶发失败(linuxdeploy 工具链问题),失败不阻塞 deb 产物
      - name: Build AppImage
        continue-on-error: true
        run: |
          curl -sL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp assets/app/icon_256.png AppDir/flux.png
          printf '[Desktop Entry]\nName=Flux\nExec=flux\nIcon=flux\nType=Application\nCategories=Network;\n' \
            > AppDir/flux.desktop
          # CI 环境无 FUSE,以解压模式运行 AppImage 工具
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy --appdir AppDir --output appimage
          mv Flux-*-x86_64.AppImage flux-linux-x86_64.AppImage

      - name: Build deb
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER=${VER#v}
          mkdir -p pkg/DEBIAN pkg/opt/flux pkg/usr/bin \
            pkg/usr/share/applications pkg/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* pkg/opt/flux/
          ln -s /opt/flux/flux pkg/usr/bin/flux
          cp assets/app/icon_256.png pkg/usr/share/icons/hicolor/256x256/apps/flux.png
          printf '[Desktop Entry]\nName=Flux\nExec=flux\nIcon=flux\nType=Application\nCategories=Network;\n' \
            > pkg/usr/share/applications/flux.desktop
          printf 'Package: flux\nVersion: %s\nArchitecture: amd64\nMaintainer: flux\nDescription: frp cross-platform GUI client\nDepends: libgtk-3-0, libayatana-appindicator3-1, libsecret-1-0\n' "$VER" \
            > pkg/DEBIAN/control
          dpkg-deb --build pkg flux-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: flux-linux-x64-appimage
          path: flux-linux-x86_64.AppImage
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: flux-linux-x64-deb
          path: flux-linux-amd64.deb

  # 试验性:arm64 runner 的 Flutter 安装尚不稳定,失败不阻塞发版
  linux-arm64:
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
          libayatana-appindicator3-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Bundle frpc
        run: |
          bash scripts/fetch_frpc.sh linux arm64 "$FRPC_VERSION"
          cp third_party/frpc/linux-arm64/frpc build/linux/arm64/release/bundle/

      - name: Build AppImage
        continue-on-error: true
        run: |
          curl -sL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          chmod +x linuxdeploy
          mkdir -p AppDir/usr/bin
          cp -r build/linux/arm64/release/bundle/* AppDir/usr/bin/
          cp assets/app/icon_256.png AppDir/flux.png
          printf '[Desktop Entry]\nName=Flux\nExec=flux\nIcon=flux\nType=Application\nCategories=Network;\n' \
            > AppDir/flux.desktop
          # CI 环境无 FUSE,以解压模式运行 AppImage 工具
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy --appdir AppDir --output appimage
          mv Flux-*.AppImage flux-linux-arm64.AppImage || true

      - name: Build deb
        env:
          VER: ${{ github.ref_name }}
        run: |
          VER=${VER#v}
          mkdir -p pkg/DEBIAN pkg/opt/flux pkg/usr/bin \
            pkg/usr/share/applications pkg/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/arm64/release/bundle/* pkg/opt/flux/
          ln -s /opt/flux/flux pkg/usr/bin/flux
          cp assets/app/icon_256.png pkg/usr/share/icons/hicolor/256x256/apps/flux.png
          printf '[Desktop Entry]\nName=Flux\nExec=flux\nIcon=flux\nType=Application\nCategories=Network;\n' \
            > pkg/usr/share/applications/flux.desktop
          printf 'Package: flux\nVersion: %s\nArchitecture: arm64\nMaintainer: flux\nDescription: frp cross-platform GUI client\nDepends: libgtk-3-0, libayatana-appindicator3-1, libsecret-1-0\n' "$VER" \
            > pkg/DEBIAN/control
          dpkg-deb --build pkg flux-linux-arm64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: flux-linux-arm64-appimage
          path: flux-linux-arm64.AppImage
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: flux-linux-arm64-deb
          path: flux-linux-arm64.deb
        continue-on-error: true

  # 汇总:主流产物就绪后统一挂到 Release(避免并发创建冲突)
  # macos-x64 因 Intel runner 排队慢,不纳入 needs,由其 job 自行追加
  release:
    needs: [windows, macos-arm64, linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
